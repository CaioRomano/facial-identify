[project]
name = "facial-identify"
version = "0.1.0"
description = "serviço de consumo, isolado, com foco único em reconhecimento facial sem estado com capacidade de ser conectado a outros serviços mais complexos."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "W",
    "I",
    "B",
    "C4",
    "UP",
    "N",
]
ignore = [
    "E501"
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
files = ["src/facial_identify", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests"
]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: testes demorados",
    "integration: testes que usam banco de dados ou rede",
]
xfail_strict = true

[tool.coverage.run]
source = [
    "facial_identify"
]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 20
